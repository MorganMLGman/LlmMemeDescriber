name: Build and Push Multi-Architecture Docker Image

on:
  push:
    tags: 
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: llm-meme-describer

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --deploy --ignore-pipfile
        env:
          PIPENV_VENV_IN_PROJECT: 1
      
      - name: Run tests
        run: pipenv run pytest -q
        env:
          PIPENV_VENV_IN_PROJECT: 1

  build-js:
    name: Build JavaScript Bundle
    uses: ./.github/workflows/build-js-bundle.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.platform }} Image
    needs: [test, build-js]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64 
            arch: arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JS bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: js-bundle-${{ github.sha }}
          path: llm_memedescriber/static/
      
      - name: Verify bundle downloaded
        run: |
          ls -lh llm_memedescriber/static/bundle*
          echo "✅ JS bundle downloaded successfully"
      
      - name: Determine app version and replace placeholder
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="sha-${GITHUB_SHA:0:7}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/APP_VERSION_PLACEHOLDER/$VERSION/g" llm_memedescriber/templates/base.html
          echo "✅ Replaced APP_VERSION_PLACEHOLDER with $VERSION"
      
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Generate metadata
        id: meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:check-${{ github.sha }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
      
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: TARGETARCH=${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      
      - name: Test Python imports
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint /app/.venv/bin/python \
            ${{ steps.meta.outputs.tag }} -c "import pydantic_core._pydantic_core; print('✅ Python imports OK')"
      
      - name: Test ffmpeg availability
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint "" ${{ steps.meta.outputs.tag }} ffmpeg -version
          docker run --rm --platform ${{ matrix.platform }} --entrypoint "" ${{ steps.meta.outputs.tag }} ffprobe -version
          echo "✅ ffmpeg/ffprobe OK"

  publish:
    name: Create Multi-Architecture Manifest
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Generate tags
        id: tags
        run: |
          DOCKERHUB_USER=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Ensure VERSION follows semantic versioning: MAJOR.MINOR.PATCH with numeric components
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$VERSION' is not a valid semantic version (expected format: MAJOR.MINOR.PATCH)." >&2
            exit 1
          fi

          MAJOR=${VERSION%%.*}
          MINOR=${VERSION%.*}
          
          TAGS=(
            "$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:$VERSION"
            "$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:$MINOR" 
            "$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:latest"
            "ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:$VERSION"
            "ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:$MINOR"
            "ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:latest"
          )
          
          # Don't tag major version for 0.x releases
          if [[ ! $VERSION =~ ^0\. ]]; then
            TAGS+=("$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:$MAJOR")
            TAGS+=("ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:$MAJOR")
          fi
          
          printf '%s\n' "${TAGS[@]}" | tee tags.txt
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "${TAGS[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create and push multi-arch manifests
        run: |
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          while IFS= read -r tag; do
            echo "Creating manifest for: $tag"
            docker buildx imagetools create --tag "$tag" \
              ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:check-${{ github.sha }}-amd64 \
              ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:check-${{ github.sha }}-arm64
          done < tags.txt
          
          echo "✅ Multi-architecture manifests created successfully"

  publish-dispatch:
    name: Create SHA-based Images (Manual Trigger)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Create SHA-based tags
        run: |
          DOCKERHUB_USER=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${GITHUB_SHA:0:7}
          
          TAGS=(
            "$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"
            "ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA"
          )
          
          for tag in "${TAGS[@]}"; do
            echo "Creating manifest for: $tag"
            docker buildx imagetools create --tag "$tag" \
              ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:check-${{ github.sha }}-amd64 \
              ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:check-${{ github.sha }}-arm64
          done
          
          echo "✅ SHA-based manifests created successfully"

  notify:
    name: Send Telegram Notification
    needs: [publish, publish-dispatch]
    runs-on: ubuntu-latest
    if: always() && (needs.publish.result == 'success' || needs.publish-dispatch.result == 'success')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate notification message
        id: message
        run: |
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_USER=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')
          
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            cat > /tmp/message.txt << 'EOF'
          ✅ **Build Success: LLM Meme Describer v$VERSION**
          
          📦 **Available Tags:**
          
          🐳 **Docker Hub:**
          • `$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:$VERSION`
          • `$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:latest`
          
          🐳 **GHCR:**
          • `ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:$VERSION`
          • `ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:latest`
          
          🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
            sed -i "s|\$VERSION|$VERSION|g" /tmp/message.txt
            sed -i "s|\$DOCKERHUB_USER|$DOCKERHUB_USER|g" /tmp/message.txt
            sed -i "s|\$REPO_OWNER|$REPO_OWNER|g" /tmp/message.txt
          else
            SHORT_SHA=${GITHUB_SHA:0:7}
            cat > /tmp/message.txt << 'EOF'
          ✅ **Build Success: LLM Meme Describer (SHA-$SHORT_SHA)**
          
          📦 **Available Images:**
          
          🐳 **Docker Hub:** `$DOCKERHUB_USER/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA`
          🐳 **GHCR:** `ghcr.io/$REPO_OWNER/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA`
          
          🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
            sed -i "s|\$SHORT_SHA|$SHORT_SHA|g" /tmp/message.txt
            sed -i "s|\$DOCKERHUB_USER|$DOCKERHUB_USER|g" /tmp/message.txt
            sed -i "s|\$REPO_OWNER|$REPO_OWNER|g" /tmp/message.txt
          fi
          
          echo "message<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/message.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.message.outputs.message }}
          format: markdown

  notify-failure:
    name: Send Failure Notification
    needs: [test, build, publish, publish-dispatch]
    runs-on: ubuntu-latest
    if: always() && (needs.test.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure' || needs.publish-dispatch.result == 'failure')
    
    steps:
      - name: Generate failure message
        id: message
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TRIGGER="Release v$VERSION"
          else
            SHORT_SHA=${GITHUB_SHA:0:7}
            TRIGGER="Commit $SHORT_SHA"
          fi
          
          FAILED_JOBS=""
          [[ "${{ needs.test.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS\n• Tests"
          [[ "${{ needs.build.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS\n• Build"
          [[ "${{ needs.publish.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS\n• Publish"
          [[ "${{ needs.publish-dispatch.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS\n• Publish (Dispatch)"
          
          cat > /tmp/message.txt << EOF
          ❌ **Build Failed: LLM Meme Describer**
          
          🔴 **Trigger:** $TRIGGER
          
          **Failed Jobs:**$FAILED_JOBS
          
          🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          👤 **Author:** ${{ github.actor }}
          📝 **Commit:** \`${GITHUB_SHA:0:7}\`
          EOF
          
          echo "message<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/message.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.message.outputs.message }}
          format: markdown