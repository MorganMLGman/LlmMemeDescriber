services:
  llm-meme-describer:
    image: morganmlg/llm-meme-describer:latest
    container_name: llm-meme-describer
    user: "1000:1000"
    ports:
      - "8443:8443"  # HTTPS (default, when NO_TLS=false)
      # - "8080:8080"  # HTTP (when NO_TLS=true)
    
    # Volume mounts
    volumes:
      # Main data directory for caching and database
      - ./data:/data

    # GPU device passthrough (Intel iGPU)
    devices:
      - /dev/dri/card0:/dev/dri/card0      # Primary GPU device
      - /dev/dri/renderD128:/dev/dri/renderD128  # Render node for VAAPI

    # Environment variables
    environment:
      # ========== REQUIRED VARIABLES ==========
      
      # === Google Generative AI Configuration (REQUIRED) ===
      # Note: GOOGLE_GENAI_API_KEY is provided via secrets (see below)
      # GOOGLE_GENAI_API_KEY: "<your_api_key_here>" # if not using secrets
      
      # === WebDAV Configuration (REQUIRED for remote storage) ===
      # Base URL of WebDAV server (with full path to collection)
      WEBDAV_URL: "https://example.com/remote.php/dav/files/user"
      # Path within WebDAV to scan for images
      WEBDAV_PATH: "/Path/To/Images"
      # Note: WEBDAV_USERNAME and WEBDAV_PASSWORD are provided via secrets
      # WEBDAV_USERNAME: "<your_username_here>" # if not using secrets
      # WEBDAV_PASSWORD: "<your_password_here>" # if not using secrets
      
      # ========== OPTIONAL VARIABLES (with defaults) ==========
      
      # === Logging Configuration ===
      # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
      # Default: INFO
      LOGGING_LEVEL: "INFO"
      
      # === Timezone ===
      # IANA timezone for log timestamps (e.g., UTC, Europe/Warsaw, America/New_York)
      # Default: UTC
      TIMEZONE: "UTC"
      
      # === SSL/TLS Configuration (OPTIONAL) ===
      # By default, the app runs on HTTPS (port 8443) with auto-generated self-signed certificates.
      # This is safe for development and when deployed behind a reverse proxy (e.g., Cloudflare).
      #
      # To DISABLE TLS entirely (plain HTTP on port 8080):
      # NO_TLS: "true"
      # Note: When NO_TLS=true, change port mapping above to: - "8080:8080"
      #
      # For production with custom certificates (via secrets or files):
      # SSL_CERT_FILE: "/run/secrets/ssl_cert_file"  # Certificate (PEM format)
      # SSL_KEY_FILE: "/run/secrets/ssl_key_file"    # Private key (PEM format)
      # SSL_HOSTNAME: "example.com"                   # CN for self-signed cert generation
      #
      # Default behavior (NO_TLS=false):
      # - Server runs on https://0.0.0.0:8443 (HTTPS)
      # - Self-signed certificates auto-generated in /data/certs/
      # - HTTPS redirect middleware enabled
      # - Secure cookie flag enabled
      #
      # When NO_TLS=true:
      # - Server runs on http://0.0.0.0:8080 (plain HTTP)
      # - No SSL certificates generated
      # - HTTPS redirect middleware disabled
      # - Secure cookie flag disabled
      # - WARNING: Only use behind a TLS-terminating reverse proxy (e.g., Cloudflare Tunnel)

      # === TLS/SSL Settings (OPTIONAL) ===
      # Disable TLS and run in plain HTTP mode (port 8080)
      # ONLY use this behind a TLS-terminating reverse proxy
      # Default: false (HTTPS enabled on port 8443)
      # NO_TLS: "false"

      # === Google Generative AI Configuration ===
      # Model to use for analysis
      # Default: gemini-3-flash-preview
      GOOGLE_GENAI_MODEL: "gemini-3-flash-preview"
      
      # === Processing Configuration ===
      # Interval between sync/processing runs (e.g., 15min, 1h, 30s)
      # The service scans WebDAV for new/removed files and generates descriptions at this interval
      # Default: 15min
      RUN_INTERVAL: "15min"
      # Maximum attempts to generate description for a meme
      # Default: 3
      MAX_GENERATION_ATTEMPTS: "3"
      # Enable automatic background worker (recommended: true)
      # Default: true
      AUTO_START_WORKER: "true"
      
      # === Redis Session Management (OPTIONAL) ===
      # Enable persistent session storage with Redis
      # If not set, sessions are stored in-memory (lost on container restart)
      # Requires Redis service to be running
      # Format: redis://redis:6379/0 (redis is the service hostname in docker-compose)
      # Default: not set (uses in-memory sessions)
      # REDIS_URL: "redis://redis:6379/0"
      # Redis password (REQUIRED if REDIS_URL is set)
      # REDIS_PASSWORD: "<your_redis_password>"
      
      # === Advanced Configuration ===
      # Number of concurrent storage workers
      # Default: 4
      STORAGE_WORKERS: "4"
      # Storage concurrency limit
      # Default: 2
      STORAGE_CONCURRENCY: "2"
      # Maximum records to sync per batch
      # Default: 500
      SYNC_MAX_RECORDS: "500"
    
    # Docker Secrets (for sensitive data)
    secrets:
      - google_genai_api_key
      - webdav_username
      - webdav_password
      # Optional: SSL certificate secrets (for production deployments)
      # Uncomment if providing your own certificates:
      # - ssl_cert_file
      # - ssl_key_file
    
    # Restart policy
    restart: unless-stopped
    
    # Network configuration (optional)
    networks:
      - meme-network
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: llm-meme-describer-redis

    # Redis password must match REDIS_PASSWORD env var in app service
    command: redis-server --requirepass ${REDIS_PASSWORD}
    
    # Volume for data persistence
    volumes:
      - ./redis-data:/data
    
    # Network configuration
    networks:
      - meme-network
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Networks
networks:
  meme-network:
    driver: bridge

# Secret definitions
secrets:
  google_genai_api_key:
    file: ./secrets/google_genai_api_key
  
  webdav_username:
    file: ./secrets/webdav_username
  
  webdav_password:
    file: ./secrets/webdav_password
  
  # Optional: SSL certificate secrets for production deployments
  # If using your own certificates, uncomment and update paths:
  # ssl_cert_file:
  #   file: ./certs/server.crt
  # ssl_key_file:
  #   file: ./certs/server.key
